[versions]
# --- Build ---------------------------------------------------------------
# AGP 9.3.x requires Gradle 9.5+ and JDK 17. Gradle version lives in
# gradle/wrapper/gradle-wrapper.properties, not here.
agp = "9.3.1"
# AGP 9 has BUILT-IN Kotlin: org.jetbrains.kotlin.android must NOT be applied.
# The only supported way to raise the bundled KGP is the buildscript classpath
# in the root build.gradle.kts — keep these two in sync with the literals there.
kotlin = "2.3.21"
# KSP has its own version line now (decoupled from Kotlin). 2.3.11 is the newest;
# there is no KSP for the Kotlin 2.4 line, which is why Kotlin is pinned to 2.3.x.
ksp = "2.3.11"

# --- SDK -----------------------------------------------------------------
# API 37 = Android 17. The GitHub runner image ships platforms;android-37.0
# and build-tools;37.0.0, so no preview SDK and no extra licence step.
compileSdk = "37"
targetSdk = "37"
minSdk = "36"

# --- AndroidX / Compose --------------------------------------------------
androidxComposeBom = "2026.06.01"
androidxCore = "1.19.0"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
androidxRoom = "2.8.4"
androidxDataStore = "1.2.1"

# --- Kotlin libraries ----------------------------------------------------
kotlinxSerializationJson = "1.11.0"
kotlinxCoroutines = "1.11.0"

# --- Test ----------------------------------------------------------------
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }

# Compose artifact versions come from the BOM - never pin them individually.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidxRoom" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "androidxRoom" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidxRoom" }

androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "androidxDataStore" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Since Kotlin 2.0 the Compose compiler ships with Kotlin; its plugin version
# must equal the Kotlin version used by the build.
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
