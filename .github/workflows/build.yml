name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Needed by the rolling "latest" prerelease, which is what makes the APK
  # installable in one tap from a phone.
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # AGP 9.3 requires JDK 17.
          java-version: "17"

      # The runner image already ships platforms;android-37.0 and build-tools;37.0.0.
      # This step is ~10s of insurance against a future image change and re-accepts
      # licences idempotently. NOTE the package id is android-37.0, not android-37 —
      # API 37 uses minor API level naming.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v6

      # An agent committing over the API can lose the executable bit.
      - run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: pixel-float-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The GitHub Actions log is the entire diagnostic surface for this project.
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore

      - name: Publish rolling prerelease
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref_name == 'claude/android-skill-setup-h63vx2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            app/build/outputs/apk/debug/*.apk \
            --prerelease \
            --title "Pixel Float — latest debug build" \
            --notes "Commit ${{ github.sha }} on ${{ github.ref_name }}. Debug build, signed with the fixed repo debug key so it installs over the previous one."

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v6

      - run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: app/build/reports/**
          if-no-files-found: ignore
